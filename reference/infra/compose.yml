# Infra, target "compose": Traefik (ingress) and OpenBao (secrets) for a laptop or a single VM.
#
#   make infra-up        start both (waits for the healthchecks)
#   make secrets-seed    write the platform secrets into OpenBao
#
# Host ports (loopback only): 8088 Traefik HTTP, 8089 Traefik dashboard, 8200 OpenBao.
# Traefik is on 8088 and not 80 so it does not fight with whatever already owns 80/443 on your machine.
#
# OpenBao runs in dev mode: in-memory storage, auto-unsealed, no TLS, a fixed root token. Development only.
# Never expose it beyond localhost, never reuse the dev token anywhere else.
name: agent-layers-infra

services:
  traefik:
    image: traefik:v3.7.17
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "127.0.0.1:${INFRA_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${INFRA_DASHBOARD_PORT:-8089}:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      # Routes to the other layers go through the host-published ports.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  openbao:
    image: openbao/openbao:2.7.2
    command: ["server", "-dev"]
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-dev-root-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:${OPENBAO_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

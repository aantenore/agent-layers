# OpenTelemetry Collector (contrib): OTLP in, traces to Jaeger and Langfuse, metrics on a Prometheus endpoint.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  # Langfuse takes OTLP/HTTP with Basic auth (public key : secret key).
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check, basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/jaeger, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

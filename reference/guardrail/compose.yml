name: agent-layers-guardrail

services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    ports:
      - "127.0.0.1:5002:3000"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    ports:
      - "127.0.0.1:5001:3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  llm-guard:
    image: laiyer/llm-guard-api:0.3.16
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUTH_TOKEN: ${LLM_GUARD_TOKEN:-change-me}
      LOG_JSON: "false"
      LAZY_LOAD: "false" # load the models at startup, so a passing healthcheck means ready
    volumes:
      - ./config/scanners.yml:/home/user/app/config/scanners.yml:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s # every start downloads the prompt-injection model (no cache volume: the image user cannot write to one)

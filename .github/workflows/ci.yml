# On push and pull request: the `checks` job (build, typecheck, package tests, docs, swap matrix without services).
# The other jobs are manual: trigger them from the Actions tab or with
#   gh workflow run ci.yml -f layers='["knowledge"]'
# The `python` job (runtimes/pydantic-ai tests, with uv) runs weekly and on dispatch, never on push.
# Actions are pinned to commit SHAs (the comment names the release).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC: the python job only
  workflow_dispatch:
    inputs:
      layers:
        description: JSON array of layer ids for the per-layer tests
        type: string
        default: '["llm","knowledge","tool","guardrail","cache","telemetry"]'
      run_layer_tests:
        description: Run the per-layer live tests (starts containers)
        type: boolean
        default: true
      run_python:
        description: Run the Pydantic AI runtime tests (runtimes/pydantic-ai, with uv)
        type: boolean
        default: true
      release:
        description: Run the release job (image promotion is documented, nothing is built yet)
        type: boolean
        default: false
      promote_to:
        description: Target environment for the release job
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (dependency order)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Package tests
        run: npm run test:packages
      - name: Docs check
        run: npm run docs:check
      - name: Script tests (release tag check, telemetry settle)
        run: node --test "scripts/test/*.test.mjs"
      # Cells with needs (Docker services, uv, a real model) are skipped without --with.
      - name: Swap matrix (cells that need no external service)
        run: node scripts/swap-matrix.mjs

  lint:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Syntax check (node --check)
        run: |
          set -e
          find . -path ./node_modules -prune -o \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
      - name: Parse JSON files
        run: |
          set -e
          for f in spec/schemas/*.json reference/*/openapi.json; do
            [ -f "$f" ] || continue
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
            echo "ok $f"
          done
      - name: Install dependencies
        run: npm install
      - name: Docs check (links, layer tables, ports, env, adapter catalog, stale strings)
        run: npm run docs:check
      - name: Helm lint and template (pinned container image)
        run: make helm-template
      - name: OpenTofu fmt and validate (pinned container image)
        run: make tofu-validate

  python:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_python) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/pydantic-ai
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # uv installs the Python of .python-version; the lockfile must match pyproject.toml.
      - name: Lockfile up to date
        run: uv lock --check
      - name: Tests (in process, no gateway)
        run: uv run --frozen pytest -q

  layer-tests:
    if: ${{ inputs.run_layer_tests }}
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(inputs.layers) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare .env
        run: cp .env.example .env
      # Layers that need Ollama on the host (llm, cache and harness model calls) skip their live tests when it is unreachable.
      - name: Up
        run: make up LAYER=${{ matrix.layer }}
      - name: Test
        run: make test LAYER=${{ matrix.layer }}
      - name: Down
        if: ${{ always() }}
        run: make down LAYER=${{ matrix.layer }}

  # Image promotion, dev -> staging -> prod. The repository builds no images yet (layers use upstream images pinned
  # in reference/<id>/compose.yml), so this job only states the flow and gates it on a GitHub environment.
  #
  #   1. dev      Tags in reference/<id>/compose.yml and reference/infra/helm/agent-layers/values.yaml move together in one commit.
  #               The live layer tests above are the gate.
  #   2. staging  Same commit, same digests: re-tag the image (or copy it with `crane copy`), never rebuild.
  #               Argo CD syncs the staging Application from that commit.
  #   3. prod     Approval on the `prod` environment, then the same digest is promoted and the prod
  #               Application is synced. Rollback is a revert of the commit.
  release:
    if: ${{ inputs.release }}
    needs: lint
    runs-on: ubuntu-24.04
    environment: ${{ inputs.promote_to }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Promotion plan
        run: |
          echo "Promote to ${{ inputs.promote_to }} from ${GITHUB_SHA}"
          grep -rhoE 'image: [^ ]+' reference/*/compose.yml | sort -u
          echo "No images are built or pushed yet; see the comment above this job for the promotion flow."

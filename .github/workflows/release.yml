# Manual release: publishes every public workspace package not yet on npm, with provenance. Nothing runs on push.
#   gh workflow run release.yml -f dry_run=true
# Needs the repository secret NPM_TOKEN (npm granular access token, read and write on @agent-layers). See RELEASING.md.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and list the tarballs without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Clean build (dependency order)
        run: node scripts/build-packages.mjs --clean
      - name: Typecheck
        run: npm run typecheck
      - name: Package tests
        run: npm run test:packages
      - name: Docs check
        run: npm run docs:check
      - name: Tarball contents
        run: npm pack --dry-run --workspaces
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-unpublished.mjs --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
